<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="A quiet calendar." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Calendar" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="preload" href="fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="month-nav">
      <button class="arrow" id="prev" type="button" aria-label="Previous month">&#8249;</button>
      <h1 class="month" id="monthLabel" aria-live="polite">November 2026</h1>
      <button class="arrow" id="next" type="button" aria-label="Next month">&#8250;</button>
    </div>
    <time class="clock" id="clock">00:00</time>
  </header>

  <main class="cal" id="cal">
    <div class="weekdays" id="weekdays" aria-hidden="true"></div>
    <div class="days" id="days">
      <div class="ghost" id="ghost" aria-hidden="true"><span id="ghostNum">20</span></div>
    </div>
  </main>

  <button class="today-chip" id="todayBtn" type="button" data-show="false" tabindex="-1">today</button>
</div>
<script src="app.js?v=4" defer></script>
</body>
</html>
